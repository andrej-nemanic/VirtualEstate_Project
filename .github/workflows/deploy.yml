name: Build & Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./WebService
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/virtualestate-web-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/virtualestate-web-service:${{ github.sha }}
      - uses: docker/build-push-action@v5
        with:
          context: ./WebClient
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/virtualestate-web-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/virtualestate-web-client:${{ github.sha }}

  trigger-deploy:
    needs: build-and-push     
    runs-on: ubuntu-latest
    steps:
      - name: Webhook deploy
        run: |
          curl --fail --max-time 60 \
            -X POST \
            -H "X-Webhook-Token: ${{ secrets.WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"commit":"${{ github.sha }}","ref":"${{ github.ref }}"}' \
            "${{ secrets.WEBHOOK_URL }}"